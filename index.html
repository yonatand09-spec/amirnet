<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אמירנט">
<title>אמירנט</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef0f2; --paper:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#d5dae0;
  --sheet:#c8553d; --sheet-soft:#f6e3de; --good:#2f7d4f; --good-soft:#dff0e5; --bad:#b3372a; --bad-soft:#f7dfdb;
  --f-display:"Secular One","Heebo",system-ui,sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171d; --paper:#1a2129; --ink:#e7ebef; --muted:#9aa5b1; --line:#2c3640;
  --sheet:#e07a63; --sheet-soft:#3a2420; --good:#5cc489; --good-soft:#1c3326; --bad:#ef7d6f; --bad-soft:#3d211e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0}
h1{font-size:28px} h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:grid;gap:2px}
.stat .n{font-family:var(--f-num);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.big-btn{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:var(--sheet);color:#fff;font-family:var(--f-display);font-size:22px;cursor:pointer}
.big-btn:disabled{opacity:.5}
.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.levels{display:grid;gap:10px}
.lv{display:grid;gap:4px}
.lv .head{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar .m{background:var(--sheet)} .bar .s{background:var(--sheet-soft)}
.bar.small{height:5px}
/* session */
.progress{display:flex;gap:3px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.cur{background:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 16px;display:grid;gap:8px;text-align:center;min-height:150px;align-content:center}
.prompt-en{font-family:var(--f-en);font-weight:600;font-size:34px;direction:ltr;line-height:1.2;word-break:break-word}
.prompt-he{font-size:26px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.prompt-cloze{font-family:var(--f-en);font-size:21px;line-height:1.55;direction:ltr;text-align:left}
.prompt-cloze .blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--sheet);color:transparent}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;text-align:start}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sheet);color:var(--sheet);display:grid;place-items:center;font-family:var(--f-num);font-size:13px}
.opt.en{font-family:var(--f-en);font-size:20px;direction:ltr;text-align:left}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{min-height:48px;display:flex;align-items:center;justify-content:center}
.note{margin:0;padding:10px 12px;border-radius:10px;background:var(--sheet-soft);font-size:15px}
.opt.idk{min-height:44px;font-size:15px;color:var(--muted);border-style:dashed}
.opt.idk .k{border-color:var(--muted);color:var(--muted)}
.type-in{font-family:var(--f-en);font-size:22px;text-align:left;padding:14px}
.type-in.right{border-color:var(--good);background:var(--good-soft)}
.type-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.done{text-align:center}
.done .n{font-family:var(--f-num);font-size:44px}
label{font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
.list{display:grid;gap:0}
.list .w{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .w span:first-child{font-family:var(--f-en);direction:ltr}
.pill{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sync{font-size:13px}
.sync.ok{color:var(--good)} .sync.err{color:var(--bad)}
button:focus-visible{outline:2px solid var(--sheet);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
